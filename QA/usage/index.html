<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>사용일지</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="../../common/mobile.css" />
  <link rel="stylesheet" href="../../common/theme.css" />
</head>
<body>
  <main class="shell">
    <section class="card usage-card">
      <div class="card-head usage-head">
        <div>
          <h3>시약 사용일지</h3>
          <p>실제 사용한 시약 제품과 사용량을 기록하고 내 사용내역을 확인합니다.</p>
        </div>
        <div class="view-switch" role="tablist" aria-label="사용일지 화면 전환">
          <button class="btn active" id="usageInputViewBtn" type="button" data-view="input">사용 입력</button>
          <button class="btn" id="usageLogViewBtn" type="button" data-view="log">사용 내역</button>
        </div>
      </div>

      <div class="card-body">
        <section id="usageInputView">
          <div class="identity-bar" id="identityBar">
            <span class="identity-label">사용자</span>
            <strong id="identityName">확인 중</strong>
            <span class="identity-sub" id="identityMeta"></span>
          </div>

          <div class="usage-form-grid">
            <div class="field product-search-field">
              <label for="productSearch">제품 검색</label>
              <input id="productSearch" type="search" autocomplete="off" placeholder="품명 / 제조사 / 제품코드 / CAS 검색" />
              <div class="product-results" id="productResults" hidden></div>
            </div>

            <div class="selected-product" id="selectedProduct" hidden>
              <div class="selected-product-head">
                <div>
                  <span class="eyebrow">선택 제품</span>
                  <strong id="selectedProductName"></strong>
                </div>
                <button class="mini-btn" id="clearProductBtn" type="button">다시 선택</button>
              </div>
              <div class="selected-product-meta" id="selectedProductMeta"></div>
              <div class="selected-product-cas" id="selectedProductCas"></div>
            </div>

            <div class="field">
              <label for="usageDate">사용일</label>
              <input id="usageDate" type="date" />
            </div>
            <div class="field">
              <label for="usageTime">사용시간</label>
              <input id="usageTime" type="time" step="60" />
            </div>
            <div class="field">
              <label for="quantityType">사용량 구분</label>
              <select id="quantityType">
                <option value="volume">부피</option>
                <option value="weight">무게</option>
              </select>
            </div>
            <div class="field quantity-field">
              <label for="quantity">사용량</label>
              <div class="quantity-row">
                <input id="quantity" type="number" min="0" step="any" inputmode="decimal" placeholder="예: 500" />
                <select id="unit" aria-label="단위"></select>
              </div>
            </div>
          </div>

          <div id="inputMessage" class="message" aria-live="polite"></div>
          <div class="form-actions">
            <button class="btn primary" id="saveUsageBtn" type="button">사용기록 저장</button>
          </div>

          <div class="recent-block">
            <div class="section-head">
              <div>
                <h4>최근 입력</h4>
                <p>최근 등록한 사용기록 10건을 표시합니다.</p>
              </div>
              <button class="btn small" id="refreshRecentBtn" type="button">새로고침</button>
            </div>
            <div class="table-wrap">
              <table class="usage-table recent-table">
                <thead>
                  <tr>
                    <th>사용일시</th>
                    <th>제품</th>
                    <th>CAS No.</th>
                    <th>사용량</th>
                  </tr>
                </thead>
                <tbody id="recentUsageList">
                  <tr><td colspan="4" class="empty">사용기록을 불러오는 중입니다.</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>

        <section id="usageLogView" hidden>
          <div class="filters log-filters">
            <div class="field">
              <label for="logStartDate">시작일</label>
              <input id="logStartDate" type="date" />
            </div>
            <div class="field">
              <label for="logEndDate">종료일</label>
              <input id="logEndDate" type="date" />
            </div>
            <div class="field grow">
              <label for="logSearch">검색</label>
              <input id="logSearch" type="search" placeholder="품명 / 제조사 / 제품코드 / CAS" />
            </div>
            <div class="filter-action">
              <button class="btn" id="logResetBtn" type="button">초기화</button>
            </div>
          </div>

          <div class="summary log-summary" aria-label="내 사용일지 요약">
            <div class="tile"><span class="k">조회 건수</span><span class="v" id="logCount">0건</span></div>
            <div class="tile"><span class="k">기간</span><span class="v small" id="logPeriod">-</span></div>
          </div>

          <div id="logMessage" class="message" aria-live="polite"></div>
          <div class="table-wrap">
            <table class="usage-table log-table">
              <thead>
                <tr>
                  <th>사용일시</th>
                  <th>제품명</th>
                  <th>제조사</th>
                  <th>제품코드</th>
                  <th>CAS No.</th>
                  <th>사용량</th>
                </tr>
              </thead>
              <tbody id="usageLogList">
                <tr><td colspan="6" class="empty">사용내역을 불러오는 중입니다.</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase.js"></script>
  <script src="./app.js"></script>
  <script src="../../common/common.js"></script>
</body>
</html>
