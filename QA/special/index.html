<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>특별관리물질 현황</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="../../common/mobile.css" />
  <link rel="stylesheet" href="../../common/theme.css" />
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="card-head">
        <div>
          <h3 id="pageTitle">특별관리물질 현황</h3>
          <p id="pageDesc">특별관리물질 기준정보와 제품 연계 현황을 관리합니다.</p>
        </div>
        <div class="view-switch">
          <button class="btn active" id="statusViewBtn" type="button">특별관리물질 현황</button>
          <button class="btn" id="masterViewBtn" type="button">특별관리물질 기준관리</button>
        </div>
      </div>

      <div class="card-body">
        <section id="statusView">
          <div class="filters">
            <div class="field grow">
              <label for="statusSearch">검색</label>
              <input id="statusSearch" type="search" placeholder="물질명 / 영문명 / CAS 검색" />
            </div>
            <div class="field">
              <label for="statusFilter">상태</label>
              <select id="statusFilter">
                <option value="all">전체</option>
                <option value="active">적용중</option>
                <option value="scheduled">적용예정</option>
                <option value="ending">제외예정</option>
                <option value="ended">제외</option>
              </select>
            </div><div class="field">
              <label for="statusType">기준 유형</label>
              <select id="statusType">
                <option value="all">전체</option>
                <option value="single">특별관리물질</option>
                <option value="conditional">조건부</option>
              </select>
            </div>
          </div>
          <div class="order-controls">
            <div class="field"><label for="orderPeriod">발주기간</label><select id="orderPeriod">
              <option value="all">전체</option><option value="1y" selected>최근 1년</option><option value="3y">최근 3년</option><option value="5y">최근 5년</option><option value="custom">직접설정</option>
            </select></div>
            <div class="custom-period" id="customPeriod" hidden>
              <div class="field"><label for="orderStartDate">시작일</label><input id="orderStartDate" type="date" /></div><span class="date-sep">~</span>
              <div class="field"><label for="orderEndDate">종료일</label><input id="orderEndDate" type="date" /></div>
            </div>
            <div class="field"><label for="displayLimit">표시건수</label><select id="displayLimit">
              <option value="10" selected>10개</option><option value="20">20개</option><option value="30">30개</option><option value="all">전체</option>
            </select></div>
          </div>
          <div class="notice" id="matchNotice">제품 CAS와 실제 발주기록을 확인하고 있습니다.</div>
          <div class="match-summary">
            <span>제품매칭 <strong id="matchedSubstanceCount">0종</strong></span>
            <span>주문확인 <strong id="orderedSubstanceCount">0종</strong></span>
          </div>
          <div class="table-wrap">
            <table class="status-table">
              <thead><tr>
                <th>특별관리물질</th><th>CAS No</th><th>혼합물 기준</th><th>연결제품</th><th>주문확인</th><th>최신 발주일</th><th>상태</th>
              </tr></thead>
              <tbody id="statusList"></tbody>
            </table>
          </div>
        </section>

        <section id="masterView" hidden>
          <div class="section-head">
            <div></div>
            <button class="btn primary" id="newBtn" type="button">신규 입력</button>
          </div>

        <div class="summary">
          <div class="tile"><span class="k">전체 물질</span><span class="v" id="totalCount">0종</span></div>
          <div class="tile"><span class="k">적용중</span><span class="v" id="activeCount">0종</span></div>
          <div class="tile"><span class="k">적용예정</span><span class="v" id="scheduledCount">0종</span></div>
          <div class="tile"><span class="k">제외/제외예정</span><span class="v" id="endedCount">0종</span></div>
        </div>

          <div class="filters">
            <div class="field grow">
              <label for="masterSearch">검색</label>
              <input id="masterSearch" type="search" placeholder="유해물질명 / 영문명 / CAS 검색" />
            </div>
            <div class="field">
              <label for="masterStatus">상태</label>
              <select id="masterStatus">
                <option value="all">전체</option>
                <option value="active">적용중</option>
                <option value="scheduled">적용예정</option>
                <option value="ending">제외예정</option>
                <option value="ended">제외</option>
              </select>
            </div><div class="field">
              <label for="masterType">기준 유형</label>
              <select id="masterType">
                <option value="all">전체</option>
                <option value="single">특별관리물질</option>
                <option value="conditional">조건부</option>
              </select>
            </div>
          </div>

          <div id="message" class="message" aria-live="polite"></div>
          <div class="table-wrap">
            <table>
              <thead><tr>
                <th>유해물질명</th><th>영문명</th><th>CAS No</th><th>유형</th><th>혼합물 기준</th>
                <th>시행일</th><th>제외일</th><th>상태</th><th>작업</th>
              </tr></thead>
              <tbody id="masterList"></tbody>
            </table>
          </div>
        </section>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="editModal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h3 id="modalTitle">특별관리물질 신규 입력</h3>
        <button class="icon-btn" id="closeModal" type="button" aria-label="닫기">×</button>
      </div>
      <form id="editForm">
        <input type="hidden" id="editId" />
        <div class="form-grid">
          <label>유해물질명 *<input id="nameKo" required /></label>
          <label>영문명<input id="nameEn" /></label>
          <div class="full cas-field">
            <div class="field-title-row">
              <span>CAS No</span>
              <button class="mini-btn add-cas-btn" id="addCasBtn" type="button">+ CAS 추가</button>
            </div>
            <div id="casInputs" class="cas-inputs"></div>
          </div>
          <label>유형 *
            <select id="matchType" required>
              <option value="single">단일물질</option>
              <option value="group">그룹물질</option>
            </select>
          </label>
          <label>조건 구분 *
            <select id="conditionType" required>
              <option value="normal">일반</option>
              <option value="conditional">조건부</option>
            </select>
          </label>
          <label class="full conditional-field" id="conditionTextWrap" hidden>조건 내용
            <textarea id="conditionText" rows="3" placeholder="예: 불용성화합물만 특별관리물질 / 벤젠을 0.1% 이상 함유한 경우만 특별관리물질"></textarea>
          </label>
          <label>기준 유형 *
            <select id="thresholdType" required>
              <option value="single">특별관리물질</option>
              <option value="conditional">조건부</option>
            </select>
          </label>
          <label id="singleThresholdWrap">혼합물 기준값<input id="thresholdValue" type="number" min="0" step="0.0001" placeholder="예: 0.3" /></label>
          <label class="threshold-conditional" id="generalThresholdWrap" hidden>일반 기준값<input id="generalThresholdValue" type="number" min="0" step="0.0001" placeholder="예: 1" /></label>
          <label class="threshold-conditional" id="specialThresholdWrap" hidden>특별관리 해당 기준값<input id="specialThresholdValue" type="number" min="0" step="0.0001" placeholder="예: 0.1" /></label>
          <label>기준 단위<input id="thresholdUnit" value="%" /></label>
          <label>기준 방식<input id="thresholdBasis" value="중량비율" /></label>
          <label>시행일<input id="effectiveFrom" type="date" /></label>
          <label>제외일<input id="effectiveTo" type="date" /></label>
          <label class="full">비고<textarea id="note" rows="3"></textarea></label>
        </div>
        <div class="modal-actions">
          <button class="btn" id="cancelBtn" type="button">취소</button>
          <button class="btn primary" type="submit">저장</button>
        </div>
      </form>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase.js"></script>
  <script src="./app.js"></script>
</body>
</html>
