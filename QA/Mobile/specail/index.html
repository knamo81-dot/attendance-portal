<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>특별관리물질 관리</title>
  <link rel="stylesheet" href="./style.css?v=20260927-mobile-special1" />
  <link rel="stylesheet" href="../../../common/mobile.css" />
  <link rel="stylesheet" href="../../../common/theme.css" />
</head>
<body>
  <main class="mobile-special-shell">
    <section class="mobile-special-app">
      <div class="view-switch" role="tablist" aria-label="특별관리물질 관리 화면">
        <button id="statusViewBtn" class="view-btn active" type="button">특별관리물질</button>
        <button id="masterViewBtn" class="view-btn" type="button">기준관리</button>
      </div>

      <section id="statusView" class="screen">
        <div class="screen-head">
          <div>
            <h2>특별관리물질</h2>
            <p>특별관리물질과 연결제품·입고 현황을 확인합니다.</p>
          </div>
        </div>

        <div class="toolbar status-toolbar">
          <label class="search-field full-row">
            <span>검색</span>
            <input id="statusSearch" type="search" placeholder="국문명 / 영문명 / CAS" autocomplete="off" />
          </label>
          <label class="select-field">
            <span>상태</span>
            <select id="statusFilter">
              <option value="all">전체</option>
              <option value="active">적용중</option>
              <option value="scheduled">적용예정</option>
              <option value="ending">제외예정</option>
              <option value="ended">제외</option>
            </select>
          </label>
          <label class="select-field">
            <span>기준</span>
            <select id="statusType">
              <option value="all">전체</option>
              <option value="single">특별관리물질</option>
              <option value="conditional">조건부</option>
            </select>
          </label>
          <label class="select-field full-row">
            <span>입고기간</span>
            <select id="orderPeriod">
              <option value="all">전체</option>
              <option value="1y" selected>최근 1년</option>
              <option value="3y">최근 3년</option>
              <option value="5y">최근 5년</option>
              <option value="custom">직접설정</option>
            </select>
          </label>
          <div id="customPeriod" class="custom-period full-row" hidden>
            <label><span>시작</span><input id="orderStartDate" type="date" /></label>
            <span class="date-sep">~</span>
            <label><span>종료</span><input id="orderEndDate" type="date" /></label>
          </div>
        </div>

        <div class="match-summary">
          <span>제품매칭 <strong id="matchedSubstanceCount">0종</strong></span>
          <span>입고확인 <strong id="orderedSubstanceCount">0종</strong></span>
        </div>
        <div id="statusMessage" class="message" aria-live="polite"></div>
        <div id="statusList" class="substance-list">
          <div class="empty-card">특별관리물질을 불러오는 중입니다.</div>
        </div>
      </section>

      <section id="masterView" class="screen" hidden>
        <div class="screen-head master-head">
          <div>
            <h2>기준관리</h2>
            <p>특별관리물질 기준정보를 확인하고 관리합니다.</p>
          </div>
          <button id="newBtn" class="primary-btn" type="button">신규 입력</button>
        </div>

        <div class="summary-grid">
          <div class="summary-tile"><span>전체</span><strong id="totalCount">0종</strong></div>
          <div class="summary-tile"><span>적용중</span><strong id="activeCount">0종</strong></div>
          <div class="summary-tile"><span>적용예정</span><strong id="scheduledCount">0종</strong></div>
          <div class="summary-tile"><span>제외/예정</span><strong id="endedCount">0종</strong></div>
        </div>

        <div class="toolbar master-toolbar">
          <label class="search-field full-row">
            <span>검색</span>
            <input id="masterSearch" type="search" placeholder="국문명 / 영문명 / CAS" autocomplete="off" />
          </label>
          <label class="select-field">
            <span>상태</span>
            <select id="masterStatus">
              <option value="all">전체</option>
              <option value="active">적용중</option>
              <option value="scheduled">적용예정</option>
              <option value="ending">제외예정</option>
              <option value="ended">제외</option>
            </select>
          </label>
          <label class="select-field">
            <span>기준</span>
            <select id="masterType">
              <option value="all">전체</option>
              <option value="single">특별관리물질</option>
              <option value="conditional">조건부</option>
            </select>
          </label>
        </div>

        <div id="message" class="message" aria-live="polite"></div>
        <div id="masterList" class="substance-list">
          <div class="empty-card">기준정보를 불러오는 중입니다.</div>
        </div>
      </section>
    </section>
  </main>

  <div class="modal-backdrop" id="editModal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div>
          <h3 id="modalTitle">특별관리물질 신규 입력</h3>
          <p>특별관리물질 기준정보를 입력합니다.</p>
        </div>
        <button class="icon-btn" id="closeModal" type="button" aria-label="닫기">×</button>
      </div>
      <form id="editForm">
        <input type="hidden" id="editId" />
        <div class="form-grid">
          <label>유해물질명 *<input id="nameKo" required /></label>
          <label>영문명<input id="nameEn" /></label>
          <div class="full cas-field">
            <div class="field-title-row"><span>CAS No</span><button class="mini-btn" id="addCasBtn" type="button">+ CAS 추가</button></div>
            <div id="casInputs" class="cas-inputs"></div>
          </div>
          <label>유형 *
            <select id="matchType" required><option value="single">단일물질</option><option value="group">그룹물질</option></select>
          </label>
          <label>조건 구분 *
            <select id="conditionType" required><option value="normal">일반</option><option value="conditional">조건부</option></select>
          </label>
          <label class="full" id="conditionTextWrap" hidden>조건 내용<textarea id="conditionText" rows="3" placeholder="예: 불용성화합물만 특별관리물질"></textarea></label>
          <label>기준 유형 *
            <select id="thresholdType" required><option value="single">특별관리물질</option><option value="conditional">조건부</option></select>
          </label>
          <label id="singleThresholdWrap">혼합물 기준값<input id="thresholdValue" type="number" min="0" step="0.0001" placeholder="예: 0.3" /></label>
          <label id="generalThresholdWrap" hidden>일반 기준값<input id="generalThresholdValue" type="number" min="0" step="0.0001" placeholder="예: 1" /></label>
          <label id="specialThresholdWrap" hidden>특별관리 해당 기준값<input id="specialThresholdValue" type="number" min="0" step="0.0001" placeholder="예: 0.1" /></label>
          <label>기준 단위<input id="thresholdUnit" value="%" /></label>
          <label>기준 방식<input id="thresholdBasis" value="중량비율" /></label>
          <label>시행일<input id="effectiveFrom" type="date" /></label>
          <label>제외일<input id="effectiveTo" type="date" /></label>
          <label class="full">비고<textarea id="note" rows="3"></textarea></label>
        </div>
        <div class="modal-actions">
          <button class="secondary-btn" id="cancelBtn" type="button">취소</button>
          <button class="primary-btn" type="submit">저장</button>
        </div>
      </form>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../supabase.js?v=20260927-perm2"></script>
  <script src="./app.js?v=20260927-mobile-special1"></script>
  <script src="../../../common/common.js"></script>
</body>
</html>
